[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "1.0.0"
description = "基于 FastAPI、原生 LlamaIndex、Milvus、BM25、Ragas 评估和轻量 Web UI 的金融知识库 RAG 服务"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "llama-index-core>=0.12,<1",
    "llama-index-vector-stores-milvus>=0.5,<1",
    "llama-index-llms-dashscope>=0.3,<1",
    "llama-index-embeddings-dashscope>=0.3,<1",
    "llama-index-retrievers-bm25>=0.5,<1",
    "pymilvus>=2.5.10,<2.6",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.0,<6.0",
    "python-dotenv>=1.0.0",
    "jieba>=0.42.1",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0,<2.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
    "beautifulsoup4>=4.12,<5",
    "pillow>=10,<12",
    "pydantic>=2.10,<2.13",
    "python-multipart>=0.0.9,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]
eval = [
    "ragas>=0.2,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.15.15",
]

[project.scripts]
finrag = "finrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q -p no:cacheprovider --basetemp=.pytest-tmp-current"
filterwarnings = [
    "ignore:The 'validate_default' attribute with value True was provided to the `Field\\(\\)` function.*:pydantic.warnings.UnsupportedFieldAttributeWarning",
]
